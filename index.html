<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Typing Tutor - Practice Makes Perfect!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="trees-silhouette"></div>
    <div class="container">
        <header>
            <h1>⛏️ Minecraft Typing</h1>
            <p class="subtitle">Craft Your Skills! 🔨</p>
        </header>

        <div class="stats">
            <div class="stat-box">
                <span class="stat-label">Speed</span>
                <span class="stat-value" id="wpm">0</span>
                <span class="stat-unit">WPM</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Accuracy</span>
                <span class="stat-value" id="accuracy">100%</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Score</span>
                <span class="stat-value" id="score">0</span>
            </div>
        </div>

        <!-- Deer Guardian -->
        <div class="deer-guardian" id="deerGuardian">
            <div class="deer" id="deer">🦌</div>
            <div class="deer-distance" id="deerDistance">Far away</div>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" data-lesson="learn">Learn</button>
            <button class="mode-btn" data-lesson="review">Review</button>
            <button class="mode-btn" data-lesson="test">Test</button>
        </div>

        <div class="lesson-selector">
            <div class="letter-grid">
                <button class="letter-btn active" data-letter="a">A</button>
                <button class="letter-btn" data-letter="b">B</button>
                <button class="letter-btn" data-letter="c">C</button>
                <button class="letter-btn" data-letter="d">D</button>
                <button class="letter-btn" data-letter="e">E</button>
                <button class="letter-btn" data-letter="f">F</button>
                <button class="letter-btn" data-letter="g">G</button>
                <button class="letter-btn" data-letter="h">H</button>
                <button class="letter-btn" data-letter="i">I</button>
                <button class="letter-btn" data-letter="j">J</button>
                <button class="letter-btn" data-letter="k">K</button>
                <button class="letter-btn" data-letter="l">L</button>
                <button class="letter-btn" data-letter="m">M</button>
                <button class="letter-btn" data-letter="n">N</button>
                <button class="letter-btn" data-letter="o">O</button>
                <button class="letter-btn" data-letter="p">P</button>
                <button class="letter-btn" data-letter="q">Q</button>
                <button class="letter-btn" data-letter="r">R</button>
                <button class="letter-btn" data-letter="s">S</button>
                <button class="letter-btn" data-letter="t">T</button>
                <button class="letter-btn" data-letter="u">U</button>
                <button class="letter-btn" data-letter="v">V</button>
                <button class="letter-btn" data-letter="w">W</button>
                <button class="letter-btn" data-letter="x">X</button>
                <button class="letter-btn" data-letter="y">Y</button>
                <button class="letter-btn" data-letter="z">Z</button>
            </div>
        </div>

        <div class="keyboard">
            <div class="keyboard-row">
                <button class="key" data-key="q">Q</button>
                <button class="key" data-key="w">W</button>
                <button class="key" data-key="e">E</button>
                <button class="key" data-key="r">R</button>
                <button class="key" data-key="t">T</button>
                <button class="key" data-key="y">Y</button>
                <button class="key" data-key="u">U</button>
                <button class="key" data-key="i">I</button>
                <button class="key" data-key="o">O</button>
                <button class="key" data-key="p">P</button>
            </div>
            <div class="keyboard-row">
                <button class="key" data-key="a">A</button>
                <button class="key" data-key="s">S</button>
                <button class="key" data-key="d">D</button>
                <button class="key" data-key="f">F</button>
                <button class="key" data-key="g">G</button>
                <button class="key" data-key="h">H</button>
                <button class="key" data-key="j">J</button>
                <button class="key" data-key="k">K</button>
                <button class="key" data-key="l">L</button>
            </div>
            <div class="keyboard-row">
                <button class="key" data-key="z">Z</button>
                <button class="key" data-key="x">X</button>
                <button class="key" data-key="c">C</button>
                <button class="key" data-key="v">V</button>
                <button class="key" data-key="b">B</button>
                <button class="key" data-key="n">N</button>
                <button class="key" data-key="m">M</button>
            </div>
            <!-- Minecraft Blocks Decoration -->
            <div class="mc-decoration">
                <span class="mc-block grass">🟩</span>
                <span class="mc-block dirt">🟫</span>
                <span class="mc-block stone">⬜</span>
                <span class="mc-block diamond">💎</span>
            </div>
        </div>

        <div class="typing-area">
            <div class="word-display" id="wordDisplay">
                <span class="word">Click Start to begin!</span>
            </div>
            <input type="text" id="typingInput" placeholder="Type here..." autocomplete="off">
            <div class="feedback" id="feedback"></div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-primary">▶ Start</button>
            <button id="resetBtn" class="btn btn-secondary">↻ Reset</button>
        </div>

        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <div class="car-game" id="carGame" style="display: none;">
            <h3>⛏️ Mining Time!</h3>
            <p>Type words to mine blocks! ⛏️💎</p>
            <div class="mining-area">
                <div class="mine-field" id="mineField">
                    <div class="block" data-type="stone">🪨</div>
                    <div class="block" data-type="coal">⬛</div>
                    <div class="block" data-type="iron">🟤</div>
                    <div class="block" data-type="gold">🟡</div>
                    <div class="block" data-type="diamond">💎</div>
                    <div class="block" data-type="diamond">💎</div>
                </div>
                <div class="inventory">
                    <div class="inv-slot"><span id="stone-count">0</span>🪨</div>
                    <div class="inv-slot"><span id="coal-count">0</span>⬛</div>
                    <div class="inv-slot"><span id="iron-count">0</span>🟤</div>
                    <div class="inv-slot"><span id="gold-count">0</span>🟡</div>
                    <div class="inv-slot"><span id="diamond-count">0</span>💎</div>
                </div>
            </div>
            <div class="mining-stats">
                <div class="mining-stat">Blocks Mined: <span id="blocksMined">0</span></div>
                <div class="mining-stat">Score: <span id="mineScore">0</span></div>
            </div>
            <div class="mine-message" id="mineMessage">Type words to mine! 💪</div>
        </div>

        <footer>
            <p>🌟 Keep practicing and you'll be a typing champion! 🌟</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
